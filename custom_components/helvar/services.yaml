recall_scene:
  fields:
    group:
      required: true
      example: 4
      selector:
        number:
          min: 1
          max: 16383
          mode: box
    block:
      default: 1
      selector:
        number:
          min: 1
          max: 8
          mode: box
    scene:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    fade_time:
      selector:
        number:
          min: 0
          max: 600
          step: 0.1
          unit_of_measurement: s
          mode: box

screens:
  fields:
    group:
      required: true
      example: 500
      selector:
        number:
          min: 1
          max: 16383
          mode: box
    action:
      required: true
      selector:
        select:
          options:
            - open
            - close
            - stop

send_raw:
  fields:
    command:
      required: true
      example: ">V:2,C:14,L:1,F:0,@1.7.1.34#"
      selector:
        text:
